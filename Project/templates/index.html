<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YOLOv8 Object Detection</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen p-6">

    <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-4xl text-center">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 flex items-center justify-center gap-2">
            <span>🔍</span> YOLOv8 Object Detection
        </h1>

        <form action="/" method="post" enctype="multipart/form-data" class="flex flex-col items-center gap-4">
            <input 
                type="file" 
                name="file" 
                accept="image/*" 
                required
                class="file-input file-input-bordered w-full max-w-xs border border-gray-300 rounded-md p-2"
            >
            <button 
                type="submit"
                class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-lg transition duration-200">
                Upload & Detect
            </button>
        </form>

        {% if error_msg and not result_img %}
        <div class="mt-6 p-3 bg-yellow-100 text-yellow-800 border border-yellow-300 rounded-lg">
            <strong>Note:</strong> {{ error_msg }}
        </div>
        {% endif %}

        {% if upload_img %}
        <div class="mt-8 pt-6 border-t border-gray-200">
            <h2 class="text-2xl font-semibold text-gray-700 mb-6">Detection Result:</h2>
            
            <div class="flex flex-col md:flex-row gap-6 justify-center">
                
                <div class="flex-1 p-4 border border-gray-200 rounded-lg shadow-sm">
                    <h3 class="text-lg font-medium text-gray-600 mb-3">Original Image</h3>
                    <img src="{{ upload_img }}" alt="Uploaded Image" class="rounded-lg shadow-md max-w-full mx-auto">
                </div>
                
                <div class="flex-1 p-4 border border-gray-200 rounded-lg shadow-sm">
                    <h3 class="text-lg font-medium text-gray-600 mb-3">Detected Image</h3>
                    
                    {% if result_img %}
                        <img src="{{ result_img }}" alt="Detected Image" class="rounded-lg shadow-md max-w-full mx-auto">
                    
                    {% else %}
                        <div class="flex items-center justify-center h-full text-gray-500 p-4">
                            <p>(No 'person' detected in the image)</p>
                        </div>
                    {% endif %}

                </div>
            </div>
        </div>
        {% endif %}
        </div>

    <footer class="mt-6 text-gray-500 text-sm">
        © 2025 YOLO Flask Demo
    </footer>
</body>
</html>
